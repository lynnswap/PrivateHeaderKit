name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      version:
        description: Build version embedded in release binaries
        required: false
        type: string
        default: v0.0.0-ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  platform-checks:
    name: Build and Test ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios-simulator, watchos-simulator]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: source
          persist-credentials: false

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run release script contract tests
        if: matrix.platform == 'macos'
        run: scripts/test-release-scripts.sh

      - name: Build and test platform binaries
        env:
          VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/build-release.sh \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --test \
            --source-root "$GITHUB_WORKSPACE/source" \
            --output-dir "$GITHUB_WORKSPACE/dist/$PLATFORM"


  package-checks:
    name: Package Checks
    needs: platform-checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all platform checks
        env:
          PLATFORM_RESULT: ${{ needs.platform-checks.result }}
        run: test "$PLATFORM_RESULT" = success
