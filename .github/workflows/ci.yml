name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      version:
        description: Build version embedded in release binaries
        required: false
        type: string
        default: v0.0.0-ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  platform-checks:
    name: Build and Test ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios-simulator, watchos-simulator, iphoneos]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: source
          persist-credentials: false

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run release script contract tests
        if: matrix.platform == 'macos'
        run: scripts/test-release-scripts.sh

      - name: Build and test platform binaries
        env:
          VERSION: ${{ inputs.version || 'v0.0.0-ci' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/build-release.sh \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --test \
            --source-root "$GITHUB_WORKSPACE/source" \
            --output-dir "$GITHUB_WORKSPACE/dist/$PLATFORM"

      - name: Archive macOS executables
        if: matrix.platform == 'macos'
        run: tar -czf macos-binaries.tar.gz -C dist/macos .

      - name: Upload macOS executables
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-binaries
          path: macos-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-compatibility:
    name: Run built binaries on ${{ matrix.os }}
    needs: platform-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download macOS executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binaries

      - name: Run the built CLI and helper without rebuilding
        run: |
          sw_vers
          mkdir -p dist/macos
          tar -xzf macos-binaries.tar.gz -C dist/macos
          python3 scripts/smoke_release_binaries.py --cohort-dir dist/macos --platform macOS

  package-checks:
    name: Package Checks
    needs: [platform-checks, macos-compatibility]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all platform checks
        env:
          PLATFORM_RESULT: ${{ needs.platform-checks.result }}
          COMPATIBILITY_RESULT: ${{ needs.macos-compatibility.result }}
        run: test "$PLATFORM_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
