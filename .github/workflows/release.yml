name: Prepare Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to prepare (for example, v1.2.3)
        required: true
        type: string
      commit:
        description: Full commit SHA at the current default-branch HEAD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release Assets
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.release_digest.outputs.archive_sha256 }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Verify release target
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release commit must be a full 40-character commit SHA." >&2
            exit 1
          fi
          RELEASE_COMMIT="$(printf '%s' "${RELEASE_COMMIT}" | tr 'A-F' 'a-f')"

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]]; then
            echo "Release workflow must be dispatched from ${RELEASE_BRANCH}." >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          remote_head="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{ print $1 }')"
          if [[ -z "${remote_head}" ]]; then
            echo "Could not resolve remote branch: ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            echo "The workflow must run from the current ${RELEASE_BRANCH} HEAD." >&2
            echo "Remote HEAD: ${remote_head}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${RELEASE_COMMIT}" != "${remote_head}" ]]; then
            echo "Release commit must equal the current ${RELEASE_BRANCH} HEAD." >&2
            echo "Remote HEAD: ${remote_head}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git cat-file -e "${RELEASE_COMMIT}^{commit}"; then
            echo "Release commit does not exist: ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "Release commit is not reachable from ${RELEASE_BRANCH}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" ]]; then
            echo "Checked-out commit does not match the requested release commit." >&2
            exit 1
          fi

          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }

          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${RELEASE_COMMIT}" ]]; then
            echo "Release tag already targets a different commit: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          release_error="${RUNNER_TEMP}/release-view.err"
          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>"${release_error}")"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release already exists and is not a draft: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            if [[ -z "${tag_target}" ]]; then
              echo "Draft release exists but its tag is missing: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            echo "Existing draft release will be repaired: ${RELEASE_VERSION}"
          elif grep -Eiq '(not found|HTTP 404|no release found)' "${release_error}"; then
            echo "No existing release found; a draft will be created after verification."
          else
            cat "${release_error}" >&2
            exit 1
          fi

      - name: Build release cohort
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          scripts/build-release.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --dist-root dist

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          scripts/package-release.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-root dist \
            --output-dir release

      - name: Verify release assets
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          scripts/verify-release-assets.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release-dir release

      - name: Record trusted archive digest
        id: release_digest
        run: |
          set -euo pipefail
          archive_sha256="$(shasum -a 256 release/privateheaderkit-darwin-arm64.tar.gz | awk '{ print $1 }')"
          echo "archive_sha256=${archive_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            release/privateheaderkit-darwin-arm64.tar.gz
            release/install.sh
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  create-draft-release:
    name: Create or Repair Draft Release
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Reverify release target
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release commit must be a full 40-character commit SHA." >&2
            exit 1
          fi
          RELEASE_COMMIT="$(printf '%s' "${RELEASE_COMMIT}" | tr 'A-F' 'a-f')"

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]]; then
            echo "Release workflow must be dispatched from ${RELEASE_BRANCH}." >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          remote_head="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{ print $1 }')"
          if [[ -z "${remote_head}" ]]; then
            echo "Could not resolve remote branch: ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          if [[ "${remote_head}" != "${GITHUB_SHA}" || "${RELEASE_COMMIT}" != "${remote_head}" ]]; then
            echo "The workflow and release commit must still match the current ${RELEASE_BRANCH} HEAD." >&2
            echo "Remote HEAD: ${remote_head}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git cat-file -e "${RELEASE_COMMIT}^{commit}"; then
            echo "Release commit does not exist: ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "Release commit is not reachable from ${RELEASE_BRANCH}." >&2
            exit 1
          fi

          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }

          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${RELEASE_COMMIT}" ]]; then
            echo "Release tag already targets a different commit: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          release_error="${RUNNER_TEMP}/release-view.err"
          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>"${release_error}")"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release already exists and is not a draft: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            if [[ -z "${tag_target}" ]]; then
              echo "Draft release exists but its tag is missing: ${RELEASE_VERSION}" >&2
              exit 1
            fi
          elif ! grep -Eiq '(not found|HTTP 404|no release found)' "${release_error}"; then
            cat "${release_error}" >&2
            exit 1
          fi

      - name: Verify downloaded release assets
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          ARCHIVE_SHA256: ${{ needs.build-release.outputs.archive_sha256 }}
        run: |
          scripts/verify-release-assets.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release-dir release \
            --archive-sha256 "${ARCHIVE_SHA256}" \
            --skip-install-smoke

      - name: Create or repair draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT="$(printf '%s' "${RELEASE_COMMIT}" | tr 'A-F' 'a-f')"

          remote_head="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{ print $1 }')"
          if [[ "${remote_head}" != "${RELEASE_COMMIT}" ]]; then
            echo "The default branch changed before draft creation." >&2
            echo "Remote HEAD: ${remote_head:-<missing>}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }
          is_expected_asset() {
            case "$1" in
              privateheaderkit-darwin-arm64.tar.gz|install.sh|SHA256SUMS.txt)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${RELEASE_COMMIT}" ]]; then
            echo "Release tag changed before draft creation: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          release_error="${RUNNER_TEMP}/release-view-create.err"
          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>"${release_error}")"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release changed to a non-draft state: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            if [[ -z "${tag_target}" ]]; then
              echo "Draft release exists but its tag is missing: ${RELEASE_VERSION}" >&2
              exit 1
            fi

            while IFS= read -r asset_name; do
              [[ -n "${asset_name}" ]] || continue
              if ! is_expected_asset "${asset_name}"; then
                gh release delete-asset "${RELEASE_VERSION}" "${asset_name}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --yes
              fi
            done < <(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

            gh release upload "${RELEASE_VERSION}" \
              release/privateheaderkit-darwin-arm64.tar.gz \
              release/install.sh \
              release/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber

            echo "Repaired draft release ${RELEASE_VERSION}."
          elif grep -Eiq '(not found|HTTP 404|no release found)' "${release_error}"; then
            gh release create "${RELEASE_VERSION}" \
              release/privateheaderkit-darwin-arm64.tar.gz \
              release/install.sh \
              release/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --generate-notes \
              --target "${RELEASE_COMMIT}" \
              --title "${RELEASE_VERSION}"

            echo "Created draft release ${RELEASE_VERSION}."
          else
            cat "${release_error}" >&2
            exit 1
          fi

          final_tag_target="$(remote_tag_target)"
          if [[ "${final_tag_target}" != "${RELEASE_COMMIT}" ]]; then
            echo "Draft release tag does not target the release commit." >&2
            echo "Tag target: ${final_tag_target:-<missing>}" >&2
            echo "Release commit: ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          final_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [[ "${final_is_draft}" != "true" ]]; then
            echo "Release is not a draft after creation or repair: ${RELEASE_VERSION}" >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' privateheaderkit-darwin-arm64.tar.gz install.sh SHA256SUMS.txt | sort)"
          actual_assets="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "Draft release asset set is not exact." >&2
            printf 'Expected:\n%s\n' "${expected_assets}" >&2
            printf 'Actual:\n%s\n' "${actual_assets}" >&2
            exit 1
          fi

          echo "Draft release verified. Publish it manually after reviewing the notes."
