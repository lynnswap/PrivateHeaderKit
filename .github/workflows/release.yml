name: Release

run-name: Release draft ${{ inputs.release_id }} at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft ID supplied by scripts/release.py start
        required: true
        type: string
      target_sha:
        description: Approved full commit SHA
        required: true
        type: string
      content_digest:
        description: Approved draft fingerprint supplied by scripts/release.py start
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check approved draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub requires push access to read unpublished drafts.
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
    steps:
      - name: Require default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$WORKFLOW_REF" = "refs/heads/$RELEASE_BRANCH"

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify approved draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 scripts/release.py verify \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  validate:
    name: Validate release target
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.target_sha }}

  build-release:
    name: Build Release Assets
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      archive_sha256: ${{ steps.release_digest.outputs.archive_sha256 }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Build release cohort
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ inputs.target_sha }}
        run: |
          scripts/build-release.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --dist-root dist

      - name: Package release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ inputs.target_sha }}
        run: |
          scripts/package-release.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-root dist \
            --output-dir release

      - name: Verify release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ inputs.target_sha }}
        run: |
          scripts/verify-release-assets.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release-dir release

      - name: Record trusted archive digest
        id: release_digest
        run: |
          set -euo pipefail
          archive_sha256="$(shasum -a 256 release/privateheaderkit-darwin-arm64.tar.gz | awk '{ print $1 }')"
          echo "archive_sha256=${archive_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            release/privateheaderkit-darwin-arm64.tar.gz
            release/install.sh
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified draft
    needs: [prepare, validate, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publication credentials never execute code from the release target.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify downloaded release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ inputs.target_sha }}
          ARCHIVE_SHA256: ${{ needs.build-release.outputs.archive_sha256 }}
        run: |
          scripts/verify-release-assets.sh \
            --version "${VERSION}" \
            --commit "${COMMIT}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release-dir release \
            --archive-sha256 "${ARCHIVE_SHA256}" \
            --skip-install-smoke

      - name: Upload assets and publish approved draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 scripts/release.py publish \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --release-dir release
