name: Release

run-name: Release draft ${{ inputs.release_id }} at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft ID supplied by scripts/release.py start
        required: true
        type: string
      target_sha:
        description: Approved full commit SHA
        required: true
        type: string
      content_digest:
        description: Approved draft fingerprint supplied by scripts/release.py start
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check approved draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub requires push access to read unpublished drafts.
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
      release_url: ${{ steps.draft.outputs.release_url }}
    steps:
      - name: Require default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$WORKFLOW_REF" = "refs/heads/$RELEASE_BRANCH"

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify approved draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 scripts/release.py verify \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  source-approval-summary:
    name: Review release plan before source publication
    needs: [prepare, package-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize the candidate before release approval
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          {
            echo '## Release awaiting approval'
            echo
            printf 'Version: <code>%s</code>\n\n' "$VERSION"
            printf 'Source commit: <code>%s</code>\n\n' "$TARGET_SHA"
            printf 'Approved content digest: <code>%s</code>\n\n' "$CONTENT_DIGEST"
            printf '[Review draft title and notes](%s)\n\n' "$RELEASE_URL"
            echo 'Package CI passed. Approving release-publish authorizes public source-tag preparation and automatic publication of this unchanged draft after the remaining verification succeeds.'
          } >> "$GITHUB_STEP_SUMMARY"

  source-tag:
    name: Prepare public approved source tag
    needs: [prepare, package-tests, source-approval-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-publish
    permissions:
      contents: write
    outputs:
      source_url: ${{ steps.source.outputs.source_url }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Create only the approved tested tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 scripts/release.py prepare-source \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  package-source:
    name: Package approved source and Formula
    needs: [prepare, source-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checksums_sha256: ${{ steps.digest.outputs.checksums_sha256 }}
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: source
          persist-credentials: false

      - name: Package source and Formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ inputs.target_sha }}
          SOURCE_URL: ${{ needs.source-tag.outputs.source_url }}
        run: |
          curl --fail --location "$SOURCE_URL" --output source.tar.gz
          python3 scripts/package_release.py create \
            --source-root source --commit "$COMMIT" --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --output-dir release --source-archive source.tar.gz
          python3 scripts/package_release.py verify --version "$VERSION" --release-dir release

      - name: Record release checksums digest
        id: digest
        run: echo "checksums_sha256=$(sha256sum release/SHA256SUMS.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload source release assets
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 35

  package-tests:
    name: Test approved source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.target_sha }}
      version: ${{ needs.prepare.outputs.version }}

  homebrew:
    name: Test Formula and installed bottle
    needs: [prepare, package-source]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download source release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-source.outputs.artifact_id }}
          path: release
          digest-mismatch: error

      - name: Verify transferred assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUMS_SHA256: ${{ needs.package-source.outputs.checksums_sha256 }}
        run: |
          python3 scripts/package_release.py verify --version "$VERSION" \
            --release-dir release --checksums-sha256 "$CHECKSUMS_SHA256"

      - name: Build, bottle, reinstall and exercise all helpers
        run: scripts/test-homebrew.sh release --simulators

  publication-summary:
    name: Review verified release outputs
    needs: [prepare, package-source, package-tests, homebrew]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize the candidate before publication approval
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
          CHECKSUMS_SHA256: ${{ needs.package-source.outputs.checksums_sha256 }}
          ARTIFACT_ID: ${{ needs.package-source.outputs.artifact_id }}
        run: |
          {
            echo '## Approved release verification complete'
            echo
            printf 'Version: <code>%s</code>\n\n' "$VERSION"
            printf 'Source commit: <code>%s</code>\n\n' "$TARGET_SHA"
            printf 'Approved content digest: <code>%s</code>\n\n' "$CONTENT_DIGEST"
            printf 'Checksums file SHA-256: <code>%s</code>\n\n' "$CHECKSUMS_SHA256"
            printf '[Draft release](%s)\n\n' "$RELEASE_URL"
            printf '[Verified source and Formula artifact](https://github.com/%s/actions/runs/%s/artifacts/%s)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_ID"
            echo 'The approved candidate passed package CI and Homebrew source/bottle/helper checks. The publisher will verify its identity and publish automatically.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified source release
    needs: [prepare, source-tag, package-source, publication-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publication credentials never execute code from the release target.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-source.outputs.artifact_id }}
          path: release
          digest-mismatch: error

      - name: Verify transferred assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUMS_SHA256: ${{ needs.package-source.outputs.checksums_sha256 }}
        run: |
          python3 scripts/package_release.py verify --version "$VERSION" \
            --release-dir release --checksums-sha256 "$CHECKSUMS_SHA256"

      - name: Upload assets and publish approved draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 scripts/release.py publish \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --release-dir release
